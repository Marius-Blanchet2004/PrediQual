<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrédiQual : moins de non-qualité dans votre usine</title>
<meta name="description" content="PrédiQual lit les données de production de votre usine et vous dit à quels réglages produire pour faire moins de rebuts.">
<link rel="stylesheet" href="site.css">
<style>
  /* Hero plein écran : vidéo d'atelier en fond, tout le contenu centré */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center;
          text-align: center; color: var(--blanc); background: var(--noir) url(img/usine/flacons.jpg) center / cover; overflow: hidden; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: radial-gradient(ellipse at center, rgba(11,13,14,.55) 0%, rgba(11,13,14,.8) 100%); }
  .hero .contenu { position: relative; z-index: 1; width: 100%; max-width: 1000px; padding: 6rem 1.5rem; }
  .hero .kicker { color: rgba(255,255,255,.9); font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 600;
                 text-transform: none; letter-spacing: 0; margin: 0 auto .6rem; }
  .hero h1 { font-size: clamp(2.4rem, 5.4vw, 4.2rem); font-weight: 800; }
  .hero h1 em { font-style: normal; }
  .hero p { font-size: clamp(1.25rem, 2.2vw, 1.75rem); max-width: 32em; margin: 1.6rem auto 3rem; color: rgba(255,255,255,.85); }

  /* Le gros bouton, rectangulaire et sans effet */
  .bouton.geant { font-size: clamp(1.2rem, 2vw, 1.5rem); padding: 1.05em 2.2em; border-radius: 8px;
                  background: var(--vert); color: var(--noir); font-weight: 700; }
  .bouton.geant:hover { transform: none; background: var(--vert-fonce); }
</style>
</head>
<body>

<header class="sur-video">
  <div class="conteneur">
    <a class="logo" href="index.html">Prédi<span>Qual</span></a>
  </div>
</header>

<section class="hero">
  <!-- Vidéo Mixkit 33003 (licence libre) : flacons sur une ligne de conditionnement ; sa première image sert d'attente pendant le chargement -->
  <video src="img/usine/fond.mp4" poster="img/usine/flacons.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="contenu">
    <p class="kicker">Chers industriels,</p>
    <h1>Vos rebuts vous coûtent <span style="white-space: nowrap"><em>très cher</em>.</span></h1>
    <p>Mais rassurez-vous, PrédiQual est là pour transformer vos données capteurs en alertes qualité !</p>
    <a class="bouton geant" href="donnees.html">Démonstration avec des données d'usine</a>
  </div>
</section>

</body>
</html>
